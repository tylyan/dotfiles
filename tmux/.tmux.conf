#`=============
# Unbinds
#~=============
unbind C-b
unbind p


#`=============
# Key mappings
#~=============

# prefix
set -g prefix C-a

# send keystroke to other apps
bind C-a send-prefix

# prefix r - reload config
bind r source-file ~/.tmux.conf \; display "config reloaded"

# display pane numbers indefinitely until a pane is selected or another key is pressed
bind -T prefix q display-panes -d 0

# toggle synchronization to send command to all panes
bind e set-window-option synchronize-panes

# creating and killing sessions
bind N command-prompt -p "New Session:" "new-session -A -s '%%'"
bind K confirm kill-session

bind "\"" run-shell "~/.config/tmux/scripts/split-layout.sh #{pane_current_path}"

# floating window
bind C-g display-popup -w 60% -h 80% -E '~/.config/tmux/scripts/daily-note.sh'

# splitting panes with | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# new window in same directory
bind c new-window -c "#{pane_current_path}"

# moving between panes
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# moving between windows
bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

# resize panes
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Copy mode
#`-------------

# vim like copy mode
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-selection
bind p paste-buffer

# copy to system clipboard
bind-key -T copy-mode-vi Y send-keys -X copy-pipe-and-cancel "pbcopy"

# paste from system clipboard
bind P run "tmux set-buffer \"$(pbpaste)\"; tmux paste-buffer"


#`=============
# Settings
#~=============

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# enable vi keys
setw -g mode-keys vi

# set delay between prefix and command
set -s escape-time 1

# windows index starts at 1
set -g base-index 1

# pane index starts at 1
setw -g pane-base-index 1

# enable mouse
set -g mouse on

# renumber windows when one is closed
set -g renumber-windows on

# increase scrollback buffer
set -g history-limit 10000

# don't rename windows automatically
set -g allow-rename off

# enable focus events for vim autoread
set -g focus-events on


# Plugins
#`-------------

# [MacOS] to get tpm to work with homebrew tmux: https://github.com/tmux-plugins/tpm/issues/67#issuecomment-775411964
set-environment -g PATH "/opt/homebrew/bin:/usr/local/bin:/bin:/usr/bin"

# Catppuccin theme
run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

set -g @plugin "tmux-plugins/tpm"
set -g @plugin "tmux-plugins/tmux-sensible"
set -g @plugin 'schasse/tmux-jump'
set -g @plugin 'ofirgall/tmux-window-name'
set -g @plugin 'tmux-plugins/tmux-resurrect' # persist tmux sessions after computer restart
set -g @plugin 'tmux-plugins/tmux-continuum' # automatically saves sessions for you every 15 minutes

set -g @jump-key 'C-j'
set -g @catppuccin_flavor 'mocha'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

run "~/.tmux/plugins/tpm/tpm"
